*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#app{display:grid;grid-template-rows:1fr auto;min-height:100vh}
main{padding:16px 16px 24px;max-width:760px;width:100%;margin:0 auto}
nav{position:sticky;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln)}

.brand{display:none;align-items:center;gap:10px;padding:8px 12px 20px;font-weight:700;letter-spacing:.14em}

main{grid-column:2;grid-row:1;padding:32px;max-width:860px}nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:0 14px;border-radius:12px}nav button[aria-current=page]{background:var(--sf2)}.brand{display:flex}}
h1{font-size:26px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}

.row.done .g{text-decoration:line-through;color:var(--mu)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer}
.btn.p{background:linear-gradient(90deg,var(--ac2),var(--ac));color:#031024;border:0;font-weight:700}
.btn.d{color:var(--er)}.btn.s{min-height:36px;padding:0 10px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}
textarea{min-height:200px;resize:vertical}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.f .w{grid-column:1/-1}
label.l{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--ac);background:none;cursor:pointer;flex:none;color:var(--ac);font-weight:700;padding:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln)}

.dots{display:flex;gap:6px}.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);background:var(--sf2);padding:0}.dot.on{background:var(--ok);border-color:var(--ok)}.dot.t{outline:2px solid var(--ac);cursor:pointer}
.timer{font-size:68px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac);margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}

.empty{text-align:center;color:var(--mu);padding:18px 8px}

const $=s=>document.querySelector(s);

 const date=new Intl.DateTimeFormat(S.set.lang,{weekday:'long',day:'numeric',month:'long'}).format(new Date());
 return `<div class="top"><div><h1>${t('hi')}</h1><div class="mu">${esc(date)}</div></div></div>
 <div class="grid"><div class="stat"><b>${open().length}</b>${t('open')}</div><div class="stat"><b>${hd}/${S.habits.length}</b>${t('hab')}<div class="bar"><span style="width:${hp}%"></span></div></div><div class="stat"><b>${fmin(1)}</b>${t('fmin')}</div><div class="stat"><b>${fmin(7)}</b>${t('weekmin')}</div></div>
 <div class="card"><h2>${t('dueNow')}</h2>${due.length?due.map(taskRow).join(''):`<div class="empty">${t('none')}</div>`}</div>`}
function vTasks(){
 const o=sortOpen(open()),d=S.tasks.filter(x=>x.done);
 return `<div class="top"><h1>${t('tasks')}</h1></div>
 <form class="card" id="tf"><div class="f"><div class="w"><label class="l" for="tt">${t('title')}</label><input id="tt" required maxlength="120"></div>
 <div><label class="l" for="tp">${t('pri')}</label><select id="tp"><option value="high">${t('high')}</option><option value="med" selected>${t('med')}</option><option value="low">${t('low')}</option></select></div>
 <div><label class="l" for="td">${t('due')}</label><input id="td" type="date"></div>
 <div><label class="l" for="tm">${t('mins')}</label><input id="tm" type="number" min="5" max="480" step="5" value="30"></div></div>
 <button class="btn p">${t('addTask')}</button></form>
 <div class="card">${o.length?o.map(taskRow).join(''):`<div class="empty">${t('noTasks')}</div>`}</div>
 <button class="btn" data-plan>${t('plan')}</button>${planOut?`<div class="card" style="margin-top:12px">${planOut}</div>`:''}
 ${d.length?`<div class="card" style="margin-top:14px"><h2>${t('completed')}</h2>${d.map(taskRow).join('')}</div>`:''}`}
function mkPlan(){
 const now=new Date();let m=Math.ceil((now.getHours()*60+now.getMinutes())/15)*15,left=S.set.avail,out=[],skip=0;
 for(const x of sortOpen(open())){if(x.mins>left||m+x.mins>1440){skip++;continue}const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');out.push(`<div class="row"><span class="tag">${f(m)}–${f(m+x.mins)}</span><div class="g">${esc(x.title)}</div></div>`);m+=x.mins;left-=x.mins}
 planOut=(out.join('')||`<div class="empty">${t('none')}</div>`)+(skip?`<div class="mu">+${skip} ${t('noFit')}</div>`:'')+`<div class="note">${t('planNote')}</div>`;render()}
const F={mode:'fm',len:{fm:25,sb:5,lb:15},end:0,rem:25*60,run:false,task:'',done:false,iv:null};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(!F.run)return;F.rem=Math.max(0,Math.round((F.end-Date.now())/1000));const e=$('#tm2');if(e)e.textContent=fmt(F.rem);if(F.rem<=0){F.run=false;clearInterval(F.iv);F.done=true;if(F.mode==='fm'){S.focus.push({d:today(),m:F.len.fm,task:F.task});save();toast(t('logged'))}F.rem=F.len[F.mode]*60;if(view==='focus')render()}}
function vFocus(){
 const lab=F.run?t('pause'):(F.rem<F.len[F.mode]*60?t('resume'):t('start'));
 return `<div class="top"><h1>${t('focus')}</h1></div><div class="card">
 <div class="chips">${['fm','sb','lb'].map(k=>`<button class="btn" data-mode="${k}" aria-pressed="${F.mode===k}">${t(k)}</button>`).join('')}</div>
 <div class="timer" id="tm2" role="timer">${fmt(F.rem)}</div>
 ${F.done?`<div class="empty">${t('doneS')}</div>`:''}
 <div class="f"><div class="w"><label class="l" for="fl">${t('mins')}</label><input id="fl" type="number" min="1" max="180" value="${F.len[F.mode]}"></div>
 <div class="w"><label class="l" for="ft">${t('link')}</label><select id="ft"><option value="">${t('noLink')}</option>${open().map(x=>`<option value="${x.id}" ${F.task===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div></div>
 <div style="display:flex;gap:8px"><button class="btn p" data-fs style="flex:1">${lab}</button><button class="btn" data-fr>${t('reset')}</button></div></div>
 <div class="grid"><div class="stat"><b>${fmin(1)}</b>${t('fmin')}</div><div class="stat"><b>${fmin(7)}</b>${t('weekmin')}</div></div>`}
function vHabits(){
 const days=[6,5,4,3,2,1,0].map(back);
 return `<div class="top"><h1>${t('habits')}</h1></div>
 <form class="card" id="hf"><label class="l" for="hn">${t('habitName')}</label><div style="display:flex;gap:8px"><input id="hn" required maxlength="60"><button class="btn p">${t('addHabit')}</button></div></form>
 <div class="mu" style="margin-bottom:8px">${t('tip')}</div>
 <div class="card">${S.habits.length?S.habits.map(h=>`<div class="row" style="flex-wrap:wrap;padding:8px 0"><div class="g">${esc(h.name)}<div class="mu">${streak(h)} ${t('streak')} · ${Math.round(days.filter(d=>h.days.includes(d)).length/7*100)}% ${t('wk')}</div></div><div class="dots">${days.map(d=>`<button class="dot ${h.days.includes(d)?'on':''} ${d===today()?'t':''}" ${d===today()?`data-ht="${h.id}"`:'disabled'} aria-label="${d}" aria-pressed="${h.days.includes(d)}"></button>`).join('')}</div><button class="btn s d" data-dh="${h.id}" aria-label="${t('del')}">✕</button></div>`).join(''):`<div class="empty">${t('noHab')}</div>`}</div>`}
function vNotes(){
 if(noteId){const n=S.notes.find(x=>x.id===noteId);if(n)return `<div class="top"><button class="btn" data-nb>← ${t('back')}</button><span class="mu" id="ns" role="status">${t('saved')}</span></div><div class="card"><label class="l" for="nt">${t('noteT')}</label><input id="nt" value="${esc(n.title)}" maxlength="120"><br><br><textarea id="nb" aria-label="${t('notes')}">${esc(n.body)}</textarea></div><button class="btn d" data-dn="${n.id}">${t('del')}</button>`}
 const ns=S.notes.slice().sort((a,b)=>b.ts-a.ts);
 return `<div class="top"><h1>${t('notes')}</h1><button class="btn p" data-nn>${t('newNote')}</button></div><div class="card">${ns.length?ns.map(n=>`<div class="row"><button class="g btn" style="text-align:start;border:0;background:none" data-no="${n.id}">${esc(n.title||'—')}<div class="mu">${esc(n.body.slice(0,60))}</div></button></div>`).join(''):`<div class="empty">${t('noNotes')}</div>`}</div>`}
function vSettings(){
 return `<div class="top"><h1>${t('settings')}</h1></div><div class="card"><div class="f"><div><label class="l" for="sl">${t('lang')}</label><select id="sl"><option value="en" ${S.set.lang==='en'?'selected':''}>English</option><option value="ar" ${S.set.lang==='ar'?'selected':''}>العربية</option></select></div>
 <div><label class="l" for="st">${t('theme')}</label><select id="st"><option value="dark" ${S.set.theme==='dark'?'selected':''}>${t('dark')}</option><option value="light" ${S.set.theme==='light'?'selected':''}>${t('light')}</option></select></div>
 <div><label class="l" for="sa">${t('avail')}</label><input id="sa" type="number" min="30" max="1440" step="15" value="${S.set.avail}"></div></div></div>
 <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-exp>${t('exp')}</button><button class="btn" data-imp>${t('imp')}</button><button class="btn d" data-clr>${clearArm?t('clear2'):t('clear')}</button></div><br><textarea id="io" placeholder="${esc(t('impPh'))}" aria-label="JSON" dir="ltr">${esc(expTxt)}</textarea></div>
 <div class="note">${t('privacy')}</div><div class="note">${t('iosTip')}</div><div class="note">${t('about')}</div>`}
const views={today:vToday,tasks:vTasks,focus:vFocus,habits:vHabits,notes:vNotes,settings:vSettings};
function hdr(){return `<header class="hd"><div class="wm">${logo}NEX</div><div><button class="btn s p" id="ib" data-inst ${DI?'':'hidden'}>${t('inst')}</button><button class="btn s" data-th aria-label="${t('theme')}">${S.set.theme==='dark'?'☀':'☾'}</button><button class="btn s" data-lang aria-label="${t('lang')}">${S.set.lang==='ar'?'EN':'ع'}</button></div></header>`}
function render(){applyPrefs();nav();$('#v').innerHTML=hdr()+views[view]();}
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='tf'){const title=$('#tt').value.trim().slice(0,120);if(!title)return;const m=Math.min(480,Math.max(5,parseInt($('#tm').value)||30));S.tasks.push({id:uid(),title,pri:$('#tp').value,due:$('#td').value,mins:m,done:false});planOut=null}
 if(id==='hf'){const n=$('#hn').value.trim().slice(0,60);if(!n)return;S.habits.push({id:uid(),name:n,days:[]})}
 save();render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){view=d.go;noteId=null;render();$('#v').focus();return}
 if(d.tg){const x=S.tasks.find(x=>x.id===d.tg);x.done=!x.done;planOut=null}
 else if(d.dt){S.tasks=S.tasks.filter(x=>x.id!==d.dt);planOut=null}
 else if('plan'in d){mkPlan();return}
 else if(d.mode){if(F.run){F.run=false;clearInterval(F.iv)}F.mode=d.mode;F.rem=F.len[F.mode]*60;F.done=false}
 else if('fs'in d){if(F.run){F.run=false;clearInterval(F.iv);F.rem=Math.max(0,Math.round((F.end-Date.now())/1000))}else{F.done=false;F.task=$('#ft').value;F.end=Date.now()+F.rem*1000;F.run=true;clearInterval(F.iv);F.iv=setInterval(tick,250)}}
 else if('fr'in d){F.run=false;clearInterval(F.iv);F.rem=F.len[F.mode]*60;F.done=false}
 else if(d.ht){const h=S.habits.find(x=>x.id===d.ht),i=h.days.indexOf(today());i<0?h.days.push(today()):h.days.splice(i,1)}
 else if(d.dh){S.habits=S.habits.filter(x=>x.id!==d.dh)}
 else if('nn'in d){const n={id:uid(),title:'',body:'',ts:Date.now()};S.notes.push(n);noteId=n.id}
 else if(d.no){noteId=d.no}
 else if('nb'in d){noteId=null}
 else if(d.dn){S.notes=S.notes.filter(x=>x.id!==d.dn);noteId=null}
 else if('exp'in d){expTxt=JSON.stringify(S,null,1);try{navigator.clipboard.writeText(expTxt)}catch(_){}toast(t('copied'));render();return}
 else if('imp'in d){try{const r=JSON.parse($('#io').value);if(!valid(r))throw 0;S=r;expTxt='';save();toast(t('impOk'))}catch(_){toast(t('bad'));return}}
 else if('clr'in d){if(!clearArm){clearArm=true;render();return}clearArm=false;S=blank();expTxt='';toast(t('cleared'))}
 else if('lang'in d){S.set.lang=S.set.lang==='ar'?'en':'ar'}
 else if('th'in d){S.set.theme=S.set.theme==='dark'?'light':'dark'}
 else if('inst'in d){if(DI){DI.prompt();DI=null}render();return}
 else return;
 save();render()});
document.addEventListener('change',e=>{const id=e.target.id;
 if(id==='sl'||id==='st'){S.set[id==='sl'?'lang':'theme']=e.target.value;save();render()}
 if(id==='sa'){S.set.avail=Math.min(1440,Math.max(30,parseInt(e.target.value)||240));save()}
 if(id==='fl'){const v=Math.min(180,Math.max(1,parseInt(e.target.value)||25));F.len[F.mode]=v;if(!F.run){F.rem=v*60;F.done=false;render()}}
 if(id==='ft')F.task=e.target.value});
let nt;document.addEventListener('input',e=>{if(e.target.id!=='nt'&&e.target.id!=='nb')return;const n=S.notes.find(x=>x.id===noteId);if(!n)return;$('#ns').textContent=t('saving');clearTimeout(nt);nt=setTimeout(()=>{n.title=$('#nt').value.slice(0,120);n.body=$('#nb').value.slice(0,20000);n.ts=Date.now();if(save()){const s=$('#ns');if(s)s.textContent=t('saved')}},400)});
function net(){const o=$('#off');o.style.display=navigator.onLine?'none':'block';o.textContent=t('offline')}
addEventListener('online',net);addEventListener('offline',net);
let DI=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;const b=$('#ib');if(b)b.hidden=false});
addEventListener('appinstalled',()=>{DI=null;render()});
try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast(S.set.lang==='ar'?'يوجد تحديث. أعد فتح التطبيق.':'Update ready. Reopen the app.')})})}).catch(()=>{}))}catch(e){}
render();net();
</script>
</body>
</html>
